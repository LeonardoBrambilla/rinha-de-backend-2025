services:
  app:
    build: .
    container_name: payment_api
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=postgres://root:root@payment-processor-db:5432/rinha
      - PORT=8000
      - PAYMENT_PROCESSOR_URL_DEFAULT=http://payment-processor-default:8080
      - PAYMENT_PROCESSOR_URL_FALLBACK=http://payment-processor-fallback:8080
    depends_on:
      - payment-processor-db
    networks:
      - backend
      - payment-processor
  payment-processor-db:
    image: postgres:17-alpine
    container_name: payment-processor-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=rinha
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - '5433:5432'

volumes:
  db_data:

networks:
  backend:
    driver: bridge
  payment-processor:
    external: true