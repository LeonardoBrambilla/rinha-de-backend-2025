services:
  # ========================
  # REDIS
  # ========================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "40MB"

  # ========================
  # NGINX
  # ========================
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # ✅ Opção segura: aguarda apenas os containers iniciarem (não health check)
    depends_on:
      - app-1
      - app-2
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "30MB"

  # ========================
  # APP-1
  # ========================
  app-1:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      - QUARKUS_DATASOURCE_REACTIVE_URL=postgresql://db:5432/rinha
      - QUARKUS_DATASOURCE_USERNAME=root
      - QUARKUS_DATASOURCE_PASSWORD=root
      - PAYMENT_PROCESSOR_URL_DEFAULT=http://payment-processor-default:8080
      - PAYMENT_PROCESSOR_URL_FALLBACK=http://payment-processor-fallback:8080
      - QUARKUS_REDIS_HOSTS=redis://redis:6379
      - QUARKUS_REDIS_TIMEOUT=2s
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ✅ Health check com wget (mais compatível com Alpine)
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]  # ← Netcat: só verifica se a porta responde
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s  # ← Aumentado: Quarkus com heap pequeno pode levar ~60-75s
    networks:
      - backend
      - payment-processor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.65"   # 65% de 1 CPU
          memory: "140MB"


  # ========================
  # APP-2 (igual ao app-1)
  # ========================
  app-2:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      - QUARKUS_DATASOURCE_REACTIVE_URL=postgresql://db:5432/rinha
      - QUARKUS_DATASOURCE_USERNAME=root
      - QUARKUS_DATASOURCE_PASSWORD=root
      - PAYMENT_PROCESSOR_URL_DEFAULT=http://payment-processor-default:8080
      - PAYMENT_PROCESSOR_URL_FALLBACK=http://payment-processor-fallback:8080
      - QUARKUS_REDIS_HOSTS=redis://redis:6379
      - QUARKUS_REDIS_TIMEOUT=2s
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=100
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]  # ← Netcat: só verifica se a porta responde
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s  # ← Aumentado: Quarkus com heap pequeno pode levar ~60-75s
    networks:
      - backend
      - payment-processor
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.65"   # 65% de 1 CPU
          memory: "140MB"


  # ========================
  # POSTGRESQL
  # ========================
  db:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=rinha
      # ✅ Conexões
      - POSTGRES_MAX_CONNECTIONS=200
      # ✅ Memory tuning para container pequeno
      - POSTGRES_SHARED_BUFFERS=32MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=64MB
      - POSTGRES_WORK_MEM=2MB
      - POSTGRES_MAINTENANCE_WORK_MEM=16MB
      - POSTGRES_TEMP_BUFFERS=8MB
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d rinha"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "80MB"

volumes:
  postgres_data:
    driver: local

networks:
  backend:
    driver: bridge
  payment-processor:
    external: true
