# ========================
# SERVER
# ========================
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.limits.max-connections=20000

# ========================
# POSTGRES (REACTIVE)
# ========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/rinha
quarkus.datasource.username=root
quarkus.datasource.password=root

# Pool PostgreSQL
quarkus.datasource.reactive.max-size=30
quarkus.datasource.reactive.idle-timeout=PT2M
quarkus.datasource.reactive.postgresql.pipelining-limit=64
quarkus.datasource.reactive.postgresql.connect-timeout=PT2S

# Vert.x event loops
quarkus.vertx.event-loops-pool-size=16

# HTTP Timeouts
quarkus.http.idle-timeout=30S
quarkus.http.read-timeout=10S

# ========================
# MÉTRICAS
# ========================
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true

# ========================
# LOG
# ========================
quarkus.log.level=ERROR
quarkus.log.category."org.acme".level=ERROR

# ========================
# JACKSON
# ========================
quarkus.jackson.fail-on-unknown-properties=false

# ========================
# THREAD POOL JVM
# ========================
quarkus.thread-pool.core-threads=32
quarkus.thread-pool.max-threads=64
quarkus.thread-pool.queue-size=10000

# ========================
# TIMEOUTS PERSONALIZADOS
# ========================
payment.http.connect-timeout=1000
payment.http.read-timeout=2000

# ========================
# CACHE (Caffeine)
# ========================
quarkus.cache.enabled=true
quarkus.cache.caffeine."payments-summary".expire-after-write=PT30S
quarkus.cache.caffeine."payments-summary".maximum-size=100

# ========================
# REDIS (Configuração mínima válida)
# ========================
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.timeout=2s
# ✅ Pool: use defaults do Vert.x (não configure a menos que precise)

# Cache de 10 segundos para summary (janela fixa)
quarkus.cache.caffeine."payments-summary-window".expire-after-write=PT10S
quarkus.cache.caffeine."payments-summary-window".maximum-size=1
